[project]
name = "hivg-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "networkx>=3.2,<4", "scipy>=1.11,<2",
  "Pillow>=10.1,<13", "PyYAML>=6,<7", "PyMuPDF>=1.24.4,<2",
]

[project.optional-dependencies]
encoder = ["torch>=2.4,<3", "transformers>=4.50,<5", "sentencepiece>=0.2,<1"]
colpali = ["colpali-engine==0.3.12"]
rag-anything = ["raganything==1.4.4", "openai>=1.50,<3"]
evaluation = ["matplotlib>=3.8,<4", "datasets>=3,<5", "ijson>=3.2,<4"]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "eval"]

[tool.ruff]
line-length = 100
target-version = "py310"
